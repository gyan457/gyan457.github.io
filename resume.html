<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume & CV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- background canvas -->
    <canvas id="particlesCanvas"></canvas>

    <!-- navbar -->
    <nav class="navbar">
        <div class="logo">Portfolio<span class="dot">.</span></div>
        <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to Main Site</a>
    </nav>

    <!-- detail page section -->
    <section class="section detail-page">
        <div class="detail-card glass-card reveal" style="max-width: 900px; margin: 0 auto; text-align: center;">
            
            <!-- header actions -->
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;">
                <div style="text-align: left;">
                    <h1 class="gradient-text" style="font-size: 2.2rem; margin-bottom: 0.2rem;">Curriculum Vitae</h1>
                    <p style="color: #38bdf8; font-weight: 500;">Gyan S. Magmanlac — BS Information Technology</p>
                </div>
                <!-- pdf download link -->
                <a href="resume.pdf" download="Gyan_Magmanlac_Resume.pdf" class="btn btn-primary">
                    <i class="fa-solid fa-file-pdf"></i> Download PDF CV
                </a>
            </div>

            <!-- resume image viewer -->
            <div class="resume-image-wrapper" style="background: rgba(0, 0, 0, 0.4); padding: 1rem; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);">
                <img src="resume.png" alt="Gyan S. Magmanlac Resume" style="width: 100%; max-width: 800px; height: auto; border-radius: 8px; display: block; margin: 0 auto;">
            </div>

        </div>
    </section>

    <!-- javascript -->
    <script src="java.js"></script>
</body>
</html>
